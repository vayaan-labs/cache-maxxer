name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Validate the plugin
        run: claude plugin validate --strict .claude-plugin/plugin.json

      - name: Run the tests
        run: |
          set -o pipefail
          claude plugin test 2>&1 | tee test-output.txt

      - name: Annotate failing tests
        if: failure()
        run: |
          if [ -f test-output.txt ]; then
            grep -E '^\(fail\)' test-output.txt | sed 's/^/::error title=Test failed::/' || true
            grep -E -A6 '^\(fail\)' test-output.txt || true
          fi
